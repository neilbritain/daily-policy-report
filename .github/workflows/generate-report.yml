name: 每日政策报告生成和发布

on:
  schedule:
    # 每天早上 6:00 北京时间（UTC+8）
    # 使用 UTC 时间：6:00 北京时间 = 22:00 前一天 UTC
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4 python-dateutil python-docx

      - name: 生成 HTML 报告
        run: python scripts/generate_report.py

      - name: 生成 Word 报告
        run: python scripts/generate_word_report.py

      - name: 打包 Skill
        run: |
          mkdir -p dist
          python scripts/package_skill.py

      - name: 准备网站文件
        run: |
          mkdir -p public
          cp index.html public/
          cp -r reports public/ 2>/dev/null || true
          cp -r dist public/skills 2>/dev/null || true
          ls -la public/

      - name: 提交和推送变更
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add -A
          git commit -m "更新政策报告和Skill包 - $(date +'%Y-%m-%d %H:%M:%S')" || echo "没有新的变更"
          git push

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: # 如果使用自定义域名，修改为 policy-report.com

      - name: 生成发布摘要
        run: |
          echo "# 📊 政策报告发布成功" >> $GITHUB_STEP_SUMMARY
          echo "**生成时间**: $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 生成的文件" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ HTML 报告: reports/latest.html" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Word 报告: reports/latest.docx" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Skill 包: dist/*.skill" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 访问方式" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 网站: https://${{ github.repository_owner }}.github.io/daily-policy-report" >> $GITHUB_STEP_SUMMARY
          echo "- 📥 最新Word报告: https://${{ github.repository_owner }}.github.io/daily-policy-report/reports/latest.docx" >> $GITHUB_STEP_SUMMARY
