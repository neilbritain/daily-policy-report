name: 每日政策报告生成和发布

on:
  schedule:
    # 每天早上 7:00 日本时间（JST, UTC+9）
    # = 每天早上 6:00 北京时间（CST, UTC+8）
    # = 前一天 22:00 UTC
    # 注：GitHub 定时任务可能延迟，实际触发时间有±15分钟偏差
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允许手动触发
  push:
    branches:
      - main  # 每次推送代码也自动发布，确保内容始终最新

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4 python-dateutil python-docx

      - name: 生成 HTML 报告
        run: python scripts/generate_report.py

      - name: 生成 Word 报告
        run: python scripts/generate_word_report.py

      - name: 打包 Skill
        run: |
          mkdir -p dist
          python scripts/package_skill.py

      - name: 准备网站文件
        run: |
          mkdir -p public
          cp index.html public/
          cp -r reports public/ 2>/dev/null || true
          cp -r dist public/skills 2>/dev/null || true
          ls -la public/

      - name: 上传 Pages 构件
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 生成发布摘要
        run: |
          echo "# 📊 政策报告发布成功" >> $GITHUB_STEP_SUMMARY
          echo "**生成时间**: $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 生成的文件" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ HTML 报告: reports/latest.html" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Word 报告: reports/latest.docx" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Skill 包: dist/*.skill" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 访问方式" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 网站: https://${{ github.repository_owner }}.github.io/daily-policy-report" >> $GITHUB_STEP_SUMMARY
          echo "- 📥 最新Word报告: https://${{ github.repository_owner }}.github.io/daily-policy-report/reports/latest.docx" >> $GITHUB_STEP_SUMMARY
